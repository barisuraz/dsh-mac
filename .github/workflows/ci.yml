name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # DSH is in developer preview and moves quickly. A weekly run turns upstream
    # drift into a red build instead of a broken window for whoever installs next.
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swiftc --version
          sw_vers

      - name: Build the app
        run: ./build.sh

      - name: Verify the bundle
        run: |
          APP="build/DeepSeek Harness.app"
          test -x "$APP/Contents/MacOS/DeepSeekHarness"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          codesign --verify --deep --strict "$APP" && echo "signature ok"

      - name: Run the readiness-line parser tests
        run: |
          "build/DeepSeek Harness.app/Contents/MacOS/DeepSeekHarness" --test-parser

      - name: Run the A/B update and crash-loop tests
        run: |
          "build/DeepSeek Harness.app/Contents/MacOS/DeepSeekHarness" --test-update

      - name: Run the notice card tests
        run: |
          "build/DeepSeek Harness.app/Contents/MacOS/DeepSeekHarness" --test-notice

      - name: Run the end-to-end recovery tests
        run: ./tools/test-ab.sh

      - name: Package a release disk image and verify it round-trips
        run: |
          # Builds the DMG, mounts it, and confirms the app inside still has a
          # valid signature and that no files were added to the bundle. This is
          # the check that catches the class of bug that shipped in v1.1, where
          # AppleDouble files invalidated the signature of the released app.
          ./tools/package.sh

      - name: Verify the installer against the packaged disk image
        run: |
          # DSH_SOURCE_DIR makes install.sh use the image built above instead
          # of downloading a release, so the whole install path is exercised
          # without publishing anything.
          DSH_INSTALL_DIR="$RUNNER_TEMP/install-target" \
          DSH_NO_OPEN=1 \
          DSH_SOURCE_DIR="$PWD/build" \
            sh install.sh
          test -d "$RUNNER_TEMP/install-target/DeepSeek Harness.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/install-target/DeepSeek Harness.app"
          echo "installed and verifies"

      - name: Verify first-run provisioning installs a harness into a slot
        run: |
          # No harness on PATH, no existing slots: the app must fetch and verify
          # one. This is the path a brand new machine takes.
          DSH_NO_SYSTEM_DSH=1 \
          DSH_APP_SUPPORT="$RUNNER_TEMP/dsh-app" \
          DSH_HOME="$RUNNER_TEMP/dsh-home" \
            "build/DeepSeek Harness.app/Contents/MacOS/DeepSeekHarness" --install-harness

      - name: Verify the release signing path
        run: |
          # The hardened runtime is what notarization requires, so a local
          # release build must carry it even when ad-hoc signed.
          codesign -dv --verbose=4 "build/DeepSeek Harness.app" 2>&1 | grep -q "runtime" \
            || { echo "hardened runtime is not enabled"; exit 1; }

      - name: Install DSH and verify the end-to-end contract
        run: |
          npm install -g @deepseek-ai/dsh
          # Credentials are not needed to boot the server and serve the UI.
          DSH_HOME="$RUNNER_TEMP/dsh-home" \
            "build/DeepSeek Harness.app/Contents/MacOS/DeepSeekHarness" --check-contract
